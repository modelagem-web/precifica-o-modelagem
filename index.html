
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precificador Comunitário</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 1000px; margin: auto; padding: 20px; }
    h1, h2, h3 { color: #333; }
    label { display: block; margin-top: 10px; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; }
    table { width: 100%; margin-top: 20px; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    .button { margin-top: 10px; padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; }
    .button:hover { background: #218838; }
    .section { margin-top: 40px; }
    .insumo-item { display: flex; gap: 10px; margin-top: 10px; }
    .insumo-item select, .insumo-item input { flex: 1; }
    .insumo-item button { background: #dc3545; }
  </style>
</head>
<body>
  <h1>Precificador Comunitário</h1>

  <div class="section">
    <h2>Cadastro de Insumos</h2>
    <label>Nome do Insumo:</label>
    <input type="text" id="nomeInsumo">
    <label>Unidade de Medida:</label>
    <input type="text" id="unidadeInsumo">
    <label>Quantidade Comprada:</label>
    <input type="number" id="quantidadeComprada">
    <label>Preço Total Pago (R$):</label>
    <input type="number" id="precoPago">
    <button class="button" onclick="cadastrarInsumo()">Cadastrar Insumo</button>
    <button class="button" onclick="exportarInsumosExcel()">Exportar Insumos para Excel</button>

    <h3>Lista de Insumos</h3>
    <table id="tabelaInsumos">
      <tr><th>Nome</th><th>Unidade</th><th>Quantidade</th><th>Preço Pago</th><th>Custo Unitário</th></tr>
    </table>
  </div>

  <div class="section">
    <h2>Cadastro de Produtos (máx. 5)</h2>
    <label>Nome do Produto:</label>
    <input type="text" id="nomeProduto">
    <label>Porções:</label>
    <input type="number" id="porcoesProduto" value="1">

    <div id="listaInsumosProduto"></div>
    <button class="button" onclick="adicionarInsumoProduto()">Adicionar Insumo</button>
    <label>Preço de Venda por Unidade (R$):</label>
    <input type="number" id="precoVenda">
    <button class="button" onclick="cadastrarProduto()">Cadastrar Produto</button>

    <h3>Produtos Cadastrados</h3>
    <div id="listaProdutos"></div>
    <button class="button" onclick="exportarProdutosExcel()">Exportar Produtos para Excel</button>
  </div>

  <script>
    let insumos = JSON.parse(localStorage.getItem('insumos')) || [];
    let produtos = [];

    function salvarInsumos() {
      localStorage.setItem('insumos', JSON.stringify(insumos));
    }

    function cadastrarInsumo() {
      const nome = document.getElementById('nomeInsumo').value;
      const unidade = document.getElementById('unidadeInsumo').value;
      const quantidade = parseFloat(document.getElementById('quantidadeComprada').value);
      const preco = parseFloat(document.getElementById('precoPago').value);
      if (nome && unidade && quantidade && preco) {
        const custoUnitario = preco / quantidade;
        insumos.push({ nome, unidade, quantidade, preco, custoUnitario });
        salvarInsumos(); atualizarTabelaInsumos(); atualizarSelects();
        document.getElementById('nomeInsumo').value = '';
        document.getElementById('unidadeInsumo').value = '';
        document.getElementById('quantidadeComprada').value = '';
        document.getElementById('precoPago').value = '';
      }
    }

    function atualizarTabelaInsumos() {
      const tabela = document.getElementById('tabelaInsumos');
      tabela.innerHTML = '<tr><th>Nome</th><th>Unidade</th><th>Quantidade</th><th>Preço Pago</th><th>Custo Unitário</th></tr>';
      insumos.forEach(insumo => {
        tabela.innerHTML += `<tr>
          <td>${insumo.nome}</td>
          <td>${insumo.unidade}</td>
          <td>${insumo.quantidade}</td>
          <td>R$ ${insumo.preco.toFixed(2)}</td>
          <td>R$ ${insumo.custoUnitario.toFixed(2)}</td>
        </tr>`;
      });
    }

    function atualizarSelects() {
      document.getElementById('listaInsumosProduto').innerHTML = '';
    }

    function adicionarInsumoProduto() {
      const container = document.getElementById('listaInsumosProduto');
      if (!insumos.length) return alert("Cadastre insumos primeiro.");
      const div = document.createElement('div');
      div.className = 'insumo-item';
      const select = document.createElement('select');
      insumos.forEach((insumo, i) => {
        const opt = document.createElement('option');
        opt.value = i; opt.textContent = `${insumo.nome} (${insumo.unidade})`;
        select.appendChild(opt);
      });
      const inputQtd = document.createElement('input');
      inputQtd.type = 'number'; inputQtd.placeholder = 'Qtd usada';
      const btnRemover = document.createElement('button');
      btnRemover.textContent = 'Remover'; btnRemover.onclick = () => div.remove();
      div.appendChild(select); div.appendChild(inputQtd); div.appendChild(btnRemover);
      container.appendChild(div);
    }

    function cadastrarProduto() {
      if (produtos.length >= 5) return alert('Máximo de 5 produtos.');
      const nome = document.getElementById('nomeProduto').value;
      const porcoes = parseFloat(document.getElementById('porcoesProduto').value);
      const precoVenda = parseFloat(document.getElementById('precoVenda').value);
      const insumosUsados = [];

      document.querySelectorAll('.insumo-item').forEach(item => {
        const index = parseInt(item.children[0].value);
        const qtd = parseFloat(item.children[1].value);
        if (!isNaN(index) && !isNaN(qtd)) {
          insumosUsados.push({ ...insumos[index], qtd });
        }
      });

      const custoTotal = insumosUsados.reduce((sum, i) => sum + i.qtd * i.custoUnitario, 0);
      const custoUnitario = custoTotal / porcoes;
      const lucro = precoVenda - custoUnitario;
      const margem = (lucro / precoVenda) * 100;

      produtos.push({ nome, porcoes, precoVenda, insumos: insumosUsados, custoTotal, custoUnitario, lucro, margem });
      document.getElementById('nomeProduto').value = '';
      document.getElementById('porcoesProduto').value = 1;
      document.getElementById('precoVenda').value = '';
      atualizarListaProdutos(); atualizarSelects();
    }

    function atualizarListaProdutos() {
      const div = document.getElementById('listaProdutos');
      div.innerHTML = '';
      produtos.forEach((p, idx) => {
        div.innerHTML += `
          <div style="border:1px solid #ccc; padding:10px; margin-top:10px">
            <strong>${p.nome}</strong><br>
            Porções: ${p.porcoes}<br>
            Custo Total: R$ ${p.custoTotal.toFixed(2)}<br>
            Custo Unitário: R$ ${p.custoUnitario.toFixed(2)}<br>
            Preço Venda: R$ ${p.precoVenda.toFixed(2)}<br>
            Lucro: R$ ${p.lucro.toFixed(2)}<br>
            Margem: ${p.margem.toFixed(2)}%<br>
            <button onclick="imprimirFicha(${idx})">Imprimir</button>
          </div>
        `;
      });
    }

    function exportarInsumosExcel() {
      const ws = XLSX.utils.json_to_sheet(insumos);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Insumos");
      XLSX.writeFile(wb, "insumos.xlsx");
    }

    function exportarProdutosExcel() {
      const planilha = produtos.map(p => ({
        Produto: p.nome,
        Porções: p.porcoes,
        "Preço Venda": p.precoVenda,
        "Custo Total": p.custoTotal,
        "Custo Unitário": p.custoUnitario,
        Lucro: p.lucro,
        Margem: p.margem.toFixed(2) + "%"
      }));
      const ws = XLSX.utils.json_to_sheet(planilha);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Produtos");
      XLSX.writeFile(wb, "produtos.xlsx");
    }

    function imprimirFicha(index) {
      const p = produtos[index];
      let conteudo = `<h2>${p.nome}</h2>`;
      conteudo += `<p><strong>Porções:</strong> ${p.porcoes}</p>`;
      conteudo += `<p><strong>Preço de Venda:</strong> R$ ${p.precoVenda.toFixed(2)}</p>`;
      conteudo += `<p><strong>Custo Total:</strong> R$ ${p.custoTotal.toFixed(2)}</p>`;
      conteudo += `<p><strong>Custo Unitário:</strong> R$ ${p.custoUnitario.toFixed(2)}</p>`;
      conteudo += `<p><strong>Lucro:</strong> R$ ${p.lucro.toFixed(2)}</p>`;
      conteudo += `<p><strong>Margem:</strong> ${p.margem.toFixed(2)}%</p>`;
      conteudo += `<h3>Insumos</h3><ul>`;
      p.insumos.forEach(i => {
        conteudo += `<li>${i.nome} - ${i.qtd} ${i.unidade} (R$ ${i.custoUnitario.toFixed(2)} un)</li>`;
      });
      conteudo += `</ul>`;

      const win = window.open('', '', 'width=800,height=600');
      win.document.write('<html><head><title>Ficha Técnica</title></head><body>' + conteudo + '</body></html>');
      win.document.close();
      win.print();
    }

    atualizarTabelaInsumos();
  </script>
</body>
</html>
